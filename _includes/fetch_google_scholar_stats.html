<script>
    $(document).ready(function () {
        $.getJSON("{{ '/google-scholar-stats/gs_data.json' | relative_url }}", function (data) {
            var totalEl = document.getElementById('total_cit');
            if (totalEl) {
                totalEl.innerHTML = data['citedby'];
            }
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data');
                var paper = data['publications'] && data['publications'][paperId];
                if (!paper || paper['num_citations'] == null) {
                    return;
                }
                element.innerHTML = '| Citations: ' + paper['num_citations'];
            });
        });
    })
</script>
